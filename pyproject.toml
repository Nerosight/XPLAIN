[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xplain"
version = "0.1.0"
description = "Annotate and explain cryptic command output: SDDL strings, file permissions, nmap output, and more."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Nerosight" },
]
keywords = ["security", "pentesting", "sddl", "nmap", "cli", "explain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
xplain = "xplain.cli:main"

[project.urls]
Homepage = "https://github.com/Nerosight/xplain"
Issues = "https://github.com/Nerosight/xplain/issues"
Changelog = "https://github.com/Nerosight/xplain/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/xplain"]
